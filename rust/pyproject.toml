[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nefelis-rust"
version = "0.1"
authors = [ { name="Rémy O", email="remyoudompheng@gmail.com" } ]
description = "Utility functions for Nefelis"
readme = "README.md"
requires-python = ">=3.7"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.urls]
homepage = "https://github.com/remyoudompheng/nefelis"
documentation = "https://github.com/remyoudompheng/nefelis"

[tool.maturin]
profile = "release"
manifest-path = "Cargo.toml"
bindings = "pyo3"
strip = false
sdist-generator = "cargo"
